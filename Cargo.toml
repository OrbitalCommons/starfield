[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/starfield"]

[workspace.package]
version = "0.17.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/OrbitalCommons/starfield"

[workspace.dependencies]
starfield-core = { version = "=0.17.1", path = "crates/core", default-features = false, features = ["datastore"] }
starfield-datastore = "0.1.1"
url = "2"
tempfile = "3"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
base64 = "0.22.1"
nalgebra = "0.32"
log = "0.4"
flate2 = "1.0"
md5 = "0.7"
regex = "1.10"
rand = "0.8"
indicatif = "0.18"
arrow = "58"
cdshealpix = "0.9.1"
clap = { version = "4", features = ["derive"] }
fitsio-pure = "0.11"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "all_series"] }
