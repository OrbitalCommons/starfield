name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python3 devops/check_workspace.py
      - run: cargo clippy --workspace --features starfield/all-data -- -D warnings
      - run: cargo test --workspace --features starfield/all-data
      - run: cargo clippy -p starfield-core -p starfield --no-default-features -- -D warnings
      - run: cargo test -p starfield-core -p starfield --no-default-features
      - name: Datasource integration tests
        run: cargo test -p starfield-datasources --all-features
      - name: Check data generation scripts
        run: python3 -m py_compile crates/reflectance-library/scripts/build_table.py crates/solar-spectrum/scripts/build_table.py

  facade:
    name: Facade feature isolation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "hipparcos", "catalogs", "jpl", "surfaces"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p starfield --no-default-features --features "${{ matrix.features }}"
      - run: cargo test -p starfield --no-default-features --features "${{ matrix.features }}" --test facade

  python-comparison:
    name: Python comparison tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install references
        run: pip install "skyfield==$(cat .skyfield-version)" "astropy==$(cat .astropy-version)" "spiceypy==$(cat .spiceypy-version)" scipy
      - uses: Swatinem/rust-cache@v2
      - name: Compare core with Python references
        run: |
          export PYO3_PYTHON=$(which python)
          cargo test -p starfield-core --features python-tests -- --test-threads=1
      - name: Compile Python examples through the facade
        run: cargo check -p starfield --features python-tests --examples
