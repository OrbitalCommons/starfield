[package]
name = "starfield"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Astronomical calculations, catalogs, and data clients"
readme = "README.md"
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
starfield-catalogs = { version = "=0.18.0", path = "../catalogs", optional = true, default-features = false }
starfield-jpl = { version = "=0.18.0", path = "../jpl", optional = true, default-features = false }
starfield-surfaces = { version = "=0.18.0", path = "../surfaces", optional = true, default-features = false }
starfield-core = { version = "=0.18.0", path = "../core", default-features = false }

[features]
default = ["datastore"]
datastore = ["starfield-core/datastore"]
photometry = ["starfield-core/photometry"]
python-tests = ["starfield-core/python-tests", "dep:pyo3", "dep:anyhow"]
catalogs = ["gaia", "gaia-extended", "bright-galaxies", "hipparcos", "mast", "nsa"]
jpl = ["horizons", "sbdb", "mpc", "rubin"]
surfaces = ["planet-maps", "reflectance-library", "planet-spectra", "solar-spectrum"]
all-data = ["catalogs", "jpl", "surfaces", "gaia-all", "radial-profiles"]
gaia-all = ["gaia", "starfield-catalogs/all-releases"]
radial-profiles = ["nsa", "starfield-catalogs/radial-profiles"]
horizons = ["dep:starfield-jpl", "starfield-jpl/horizons"]
sbdb = ["dep:starfield-jpl", "starfield-jpl/sbdb"]
gaia = ["dep:starfield-catalogs", "starfield-catalogs/gaia"]
gaia-extended = ["dep:starfield-catalogs", "starfield-catalogs/gaia-extended"]
bright-galaxies = ["dep:starfield-catalogs", "starfield-catalogs/bright-galaxies"]
hipparcos = ["dep:starfield-catalogs", "starfield-catalogs/hipparcos"]
mast = ["dep:starfield-catalogs", "starfield-catalogs/mast"]
mpc = ["dep:starfield-jpl", "starfield-jpl/mpc"]
nsa = ["dep:starfield-catalogs", "starfield-catalogs/nsa", "photometry"]
planet-spectra = ["dep:starfield-surfaces", "starfield-surfaces/planet-spectra"]
planet-maps = ["dep:starfield-surfaces", "starfield-surfaces/planet-maps"]
reflectance-library = ["dep:starfield-surfaces", "starfield-surfaces/reflectance-library"]
solar-spectrum = ["dep:starfield-surfaces", "starfield-surfaces/solar-spectrum"]
rubin = ["dep:starfield-jpl", "starfield-jpl/rubin"]

[dependencies.pyo3]
version = "0.24"
optional = true

[dependencies.anyhow]
version = "1.0"
optional = true

[dev-dependencies]
starfield-datastore.workspace = true
nalgebra = "0.32"           # Linear algebra
time = "0.3"                # Time handling
num = "0.4"                 # Numerical types
lazy_static = "1.4"         # Lazy initialization
ndarray = "0.17"            # N-dimensional arrays
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
flate2 = "1.0"                                          # GZip compression
rand = "0.9"                                            # Random number generation for synthetic data
md5 = "0.7"                                             # MD5 checksum calculation
regex = "1.10"                                          # Regular expressions for parsing
byteorder = "1.5"                                       # Binary data reading/writing
thiserror = "2.0"
log = "0.4"
chrono = "0.4.40"
base64 = "0.22.1"
indicatif = "0.18"  # Progress bars and indicators
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
once_cell = "1.21.3"
clap = { version = "4.5.40", features = ["derive"] }
memmap2 = "0.9"
uom = "0.37.0"
sgp4 = "2.3.0"
tempfile = "3"
approx = "0.5"

[[example]]
name = "horizons_lookup"
required-features = ["horizons"]

[[example]]
name = "horizons_vectors"
required-features = ["horizons"]

[[example]]
name = "skyfield_comparison"
required-features = ["python-tests"]

[[example]]
name = "sbdb_lookup"
required-features = ["sbdb"]

[[example]]
name = "sbdb_close_approach"
required-features = ["sbdb"]

[[example]]
name = "workspace_catalog"
required-features = ["hipparcos", "horizons"]

[[test]]
name = "pullthrough"
required-features = ["gaia-all", "planet-maps", "planet-spectra", "mast", "hipparcos"]

[[example]]
name = "datastore_manifest"
required-features = ["gaia-all", "planet-maps", "planet-spectra", "mast"]
